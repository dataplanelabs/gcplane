[env]
_.file = ".env"
BINARY = "./gcplane"
F = "examples/local-dev"
GOCLAW_DIR = "../../nextlevelbuilder/goclaw"

[tools]
go = "1.25.9"
golangci-lint = "2.11"

# ============================================================
# Build
# ============================================================
[tasks.build]
description = "Build gcplane binary"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -ldflags "-X github.com/dataplanelabs/gcplane/cmd.Version=$VERSION" -o $BINARY .
"""

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f $BINARY coverage.out coverage_provider.out"

# ============================================================
# Tests
# ============================================================
[tasks.test]
description = "Run unit tests"
run = "go test ./... -count=1"

[tasks."test:verbose"]
description = "Run unit tests (verbose)"
run = "go test ./... -v -count=1"

[tasks."test:cover"]
description = "Run tests with coverage report"
run = """
go test ./... -coverprofile=coverage.out
go tool cover -func=coverage.out
"""

[tasks."test:race"]
description = "Run tests with race detector"
run = "go test -race ./... -count=1"

[tasks."test:script"]
description = "Run testscript golden-file tests"
run = "go test ./cmd/ -run TestScript -v -count=1"

[tasks."test:e2e"]
description = "Full e2e: reset GoClaw + test all features"
depends = ["reset"]
run = "scripts/test-e2e.sh"

# ============================================================
# CLI Commands
# ============================================================
[tasks.validate]
description = "Validate manifest"
depends = ["build"]
run = "./$BINARY validate -f $F"

[tasks.plan]
description = "Show plan"
depends = ["build"]
run = "./$BINARY plan -f $F"

[tasks.apply]
description = "Apply manifest"
depends = ["build"]
run = "./$BINARY apply -f $F"

[tasks.serve]
description = "Run continuous reconciliation"
depends = ["build"]
run = "./$BINARY serve -f $F --interval 10s"

[tasks.top]
description = "Launch TUI dashboard"
depends = ["build"]
run = "./$BINARY top -f $F"

[tasks."top:attach"]
description = "Launch TUI in attach mode"
depends = ["build"]
run = "./$BINARY top --attach ${ATTACH:-http://localhost:8480}"

# ============================================================
# GoClaw Instance
# ============================================================
[tasks."goclaw:up"]
description = "Start GoClaw (docker compose)"
run = "scripts/goclaw.sh up"

[tasks."goclaw:down"]
description = "Stop GoClaw"
run = "scripts/goclaw.sh down"

[tasks."goclaw:reset"]
description = "Reset GoClaw (wipe volumes + restart)"
run = "scripts/goclaw.sh reset"

[tasks."goclaw:logs"]
description = "Follow GoClaw logs"
run = "scripts/goclaw.sh logs"

# ============================================================
# Workflows
# ============================================================
[tasks.setup]
description = "One-click: build + start GoClaw + apply config"
depends = ["build", "goclaw:up"]
run = "scripts/wait-and-apply.sh"

[tasks.reset]
description = "Full reset: wipe GoClaw + re-apply from scratch"
depends = ["build"]
run = """
scripts/goclaw.sh reset
scripts/wait-and-apply.sh
"""

[tasks."reset:mt"]
description = "Full reset: wipe GoClaw + apply multi-tenant config"
depends = ["build"]
run = """
scripts/goclaw.sh reset
scripts/wait-and-apply.sh
echo ""
echo "=== Deploying multi-tenant resources ==="
./$BINARY apply -f examples/local-dev-mt/_system --auto-approve
./$BINARY apply -f examples/local-dev-mt/acme-corp --auto-approve
./$BINARY apply -f examples/local-dev-mt/startup-io --auto-approve
"""

[tasks.dev]
description = "Build + run TUI against local-dev"
depends = ["build"]
run = "./$BINARY top -f $F"

# ============================================================
# Multi-Tenant
# ============================================================
[tasks."mt:plan"]
description = "Plan multi-tenant local-dev (all tenants)"
depends = ["build"]
run = """
echo "=== System (tenant provisioning) ==="
./$BINARY plan -f examples/local-dev-mt/_system -v
echo ""
echo "=== Acme Corp ==="
./$BINARY plan -f examples/local-dev-mt/acme-corp -v
echo ""
echo "=== Startup.io ==="
./$BINARY plan -f examples/local-dev-mt/startup-io -v
"""

[tasks."mt:apply"]
description = "Apply multi-tenant local-dev (system → tenants)"
depends = ["build"]
run = """
echo "=== Creating tenants ==="
./$BINARY apply -f examples/local-dev-mt/_system --auto-approve
echo ""
echo "=== Deploying Acme Corp ==="
./$BINARY apply -f examples/local-dev-mt/acme-corp --auto-approve
echo ""
echo "=== Deploying Startup.io ==="
./$BINARY apply -f examples/local-dev-mt/startup-io --auto-approve
"""

[tasks."mt:destroy"]
description = "Destroy multi-tenant test resources (tenants → system)"
depends = ["build"]
run = """
echo "=== Destroying Startup.io ==="
./$BINARY destroy -f examples/local-dev-mt/startup-io --auto-approve 2>/dev/null || true
echo ""
echo "=== Destroying Acme Corp ==="
./$BINARY destroy -f examples/local-dev-mt/acme-corp --auto-approve 2>/dev/null || true
echo ""
echo "=== Destroying tenants ==="
./$BINARY destroy -f examples/local-dev-mt/_system --auto-approve 2>/dev/null || true
"""

[tasks."mt:serve"]
description = "Multi-tenant serve mode"
depends = ["build"]
run = "./$BINARY serve --tenants-dir examples/local-dev-mt --interval 30s"

# ============================================================
# Quality
# ============================================================
[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.vuln]
description = "Run vulnerability scanner"
run = """
go install golang.org/x/vuln/cmd/govulncheck@latest
govulncheck ./...
"""

[tasks.check]
description = "Build + lint + test + vuln"
depends = ["build", "lint", "test", "vuln"]
