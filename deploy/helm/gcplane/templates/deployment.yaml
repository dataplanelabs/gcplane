apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gcplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gcplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gcplane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gcplane.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8480"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "gcplane.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: gcplane
          image: {{ include "gcplane.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            {{- if .Values.tenantsDir }}
            - serve
            - --tenants-dir
            - {{ .Values.tenantsDir | quote }}
            - --interval
            - {{ .Values.serve.interval | quote }}
            {{- else if eq .Values.serve.source "git" }}
            - serve
            - --repo
            - {{ .Values.serve.git.url | quote }}
            - --branch
            - {{ .Values.serve.git.branch | quote }}
            - --path
            - {{ .Values.serve.git.path | quote }}
            - --interval
            - {{ .Values.serve.interval | quote }}
            {{- else }}
            - serve
            - -f
            - /config/manifest.yaml
            - --interval
            - {{ .Values.serve.interval | quote }}
            {{- end }}
            {{- if .Values.serve.prune }}
            - --prune
            {{- end }}
            {{- if .Values.serve.webhookSecret }}
            - --webhook-secret
            - {{ .Values.serve.webhookSecret | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8480
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- end }}
          {{- if or .Values.existingSecret .Values.envFrom }}
          envFrom:
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
            {{- if .Values.envFrom }}
            {{- toYaml .Values.envFrom | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (not .Values.tenantsDir) (eq .Values.serve.source "file") }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          {{- end }}
      {{- if or (not .Values.tenantsDir) (eq .Values.serve.source "file") }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gcplane.configMapName" . }}
      {{- end }}
