app = "gcplane"
primary_region = "sin"

[build]
  image = "ghcr.io/dataplanelabs/gcplane:latest"

[processes]
  app = "gcplane serve -f /data/manifest.yaml --interval 30s"

[http_service]
  internal_port = 8480
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "10s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[mounts]]
  source = "gcplane_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
