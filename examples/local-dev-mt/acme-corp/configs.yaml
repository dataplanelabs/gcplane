# Per-tenant config overrides for Acme Corp.
# BuiltinToolConfig: enable/disable builtin tools for this tenant.
# Tool names use kebab-case (converted to snake_case for GoClaw API).
resources:
  - kind: BuiltinToolConfig
    name: exec
    spec:
      enabled: true

  - kind: BuiltinToolConfig
    name: web-fetch
    spec:
      enabled: true

  - kind: BuiltinToolConfig
    name: read-file
    spec:
      enabled: true
