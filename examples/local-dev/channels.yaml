resources:
  - kind: Channel
    name: telegram-main
    spec:
      displayName: "Telegram Bot"
      channelType: telegram
      agentKey: data-engineer
      enabled: true
      credentials:
        token: ${GOCLAW_TELEGRAM_TOKEN}
      config:
        dmPolicy: pairing
        groupPolicy: pairing
        requireMention: true
        historyLimit: 50
        dmStream: true
        reactionLevel: minimal

  - kind: Channel
    name: slack-main
    spec:
      displayName: "Slack Bot"
      channelType: slack
      agentKey: assistant
      enabled: true
      credentials:
        botToken: ${GOCLAW_SLACK_BOT_TOKEN}
        appToken: ${GOCLAW_SLACK_APP_TOKEN}
      config:
        dmPolicy: open
        groupPolicy: pairing
        requireMention: true
        reactionLevel: full
        dmStream: true
        groupStream: true
