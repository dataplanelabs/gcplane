name: Upstream Check
on:
  schedule:
    - cron: '0 8 * * 1'  # weekly Monday 8am UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_IMAGE: ghcr.io/nextlevelbuilder/goclaw
  # Last known GoClaw version (updated manually after verifying E2E)
  KNOWN_VERSION: "v2.13.0-full"

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest upstream version
        id: check
        run: |
          docker pull ${{ env.UPSTREAM_IMAGE }}:full --quiet
          LATEST=$(docker inspect ${{ env.UPSTREAM_IMAGE }}:full \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}' 2>/dev/null || echo "unknown")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream: $LATEST"

          if [ "$LATEST" = "${{ env.KNOWN_VERSION }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No change detected"
          elif [ "$LATEST" = "unknown" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Could not detect version"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New version detected: $LATEST (was ${{ env.KNOWN_VERSION }})"
          fi

      - name: Check for existing issue
        if: steps.check.outputs.changed == 'true'
        id: existing
        run: |
          EXISTING=$(gh issue list --label upstream --state open --json number --jq 'length')
          echo "count=$EXISTING" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create issue for new version
        if: steps.check.outputs.changed == 'true' && steps.existing.outputs.count == '0'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          gh issue create \
            --title "chore: GoClaw upstream updated to ${LATEST}" \
            --body "$(cat <<EOF
          ## Upstream Update

          GoClaw \`full\` tag updated.

          - **Known:** \`${{ env.KNOWN_VERSION }}\`
          - **New:** \`${LATEST}\`

          ### Action Required
          - [ ] Verify E2E tests pass (they run against \`full\` tag automatically)
          - [ ] Update \`KNOWN_VERSION\` in \`.github/workflows/upstream-check.yml\`
          - [ ] Check for breaking API changes
          EOF
          )" \
            --label "upstream,chore"
        env:
          GH_TOKEN: ${{ github.token }}
